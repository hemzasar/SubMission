<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond bleu (ceinture bleue) -->
  <rect width="512" height="512" rx="112" fill="#1d4ed8"/>
  <g stroke="#141414" stroke-linejoin="round" stroke-linecap="round">
    <!-- Le haut du kimono : buste et manches courtes -->
    <path d="M196 104 L138 120 Q98 132 90 176 L76 298 L134 306 L142 236 L138 444 L374 444 L370 236 L378 306 L436 298 L422 176 Q414 132 374 120 L316 104 Q256 128 196 104 Z"
      fill="#ffffff" stroke-width="16"/>
    <!-- Petit pli de tissu sous les bras -->
    <path d="M150 250 Q160 290 150 330 M362 250 Q352 290 362 330" fill="none" stroke="#c9d2e6" stroke-width="10"/>
    <!-- Ouverture du col (en V) -->
    <path d="M210 112 Q256 134 302 112 L256 252 Z" fill="#c9d2e6" stroke-width="12"/>
    <!-- Col croisé : revers du dessous puis revers du dessus -->
    <path d="M186 102 L224 108 L304 336 L266 336 Z" fill="#ffffff" stroke-width="13"/>
    <path d="M326 102 L288 108 L208 336 L246 336 Z" fill="#ffffff" stroke-width="13"/>
    <!-- La ceinture noire -->
    <path d="M128 302 Q256 324 384 302 L384 352 Q256 374 128 352 Z" fill="#232323" stroke-width="13"/>
    <!-- Bout gauche qui pend -->
    <g transform="translate(232 340) rotate(16)">
      <rect x="-25" y="0" width="50" height="132" rx="8" fill="#232323" stroke-width="13"/>
    </g>
    <!-- Bout droit qui pend, avec la barrette bleu / violet / marron -->
    <g transform="translate(280 340) rotate(-16)">
      <rect x="-25" y="0" width="50" height="138" rx="8" fill="#232323" stroke-width="13"/>
      <rect x="-19" y="62" width="38" height="64" fill="#ffffff" stroke="none"/>
      <rect x="-19" y="66" width="38" height="17" fill="#1d4ed8" stroke="none"/>
      <rect x="-19" y="86" width="38" height="17" fill="#6d28d9" stroke="none"/>
      <rect x="-19" y="106" width="38" height="17" fill="#8a4f1d" stroke="none"/>
    </g>
    <!-- Le gros nœud -->
    <rect x="218" y="296" width="76" height="68" rx="20" fill="#232323" stroke-width="13"/>
    <path d="M226 342 L280 300 L292 316 L240 356 Z" fill="#3d3d3d" stroke-width="9"/>
  </g>
</svg>
